---
- name: Configure EC2 Instance and Deploy BorrowBox MERN Application
  hosts: webservers
  become: false
  vars:
    app_port: 5000
    node_env: production
    monitoring_network: borrowbox-monitoring
    monitoring_root: /opt/borrowbox/monitoring
    prometheus_image: prom/prometheus:v3.5.0
    grafana_image: grafana/grafana:12.1.1

  tasks:
    # 1. Wait for SSH connectivity
    - name: Wait for SSH connectivity
      wait_for_connection:
        delay: 5
        timeout: 300
      tags: [server_setup]

    # 2. Update apt package metadata
    - name: Update apt package metadata
      apt:
        update_cache: yes
      become: true
      tags: [server_setup]

    # 3. Install baseline prerequisite packages
    - name: Install required prerequisite packages
      apt:
        name:
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present
      become: true
      tags: [server_setup]

    # 4. Install Docker Engine using official Docker repository
    - name: Create directory for Docker GPG keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true
      tags: [server_setup]

    - name: Download Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true
      tags: [server_setup]

    - name: Add Docker official repository to apt sources
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      become: true
      tags: [server_setup]

    - name: Install Docker Engine and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      become: true
      tags: [server_setup]

    # 5. Ensure the Docker service is enabled and running
    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes
      become: true
      tags: [server_setup]

    # 6. Ensure ubuntu user can run Docker without sudo
    - name: Add ubuntu user to the docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      become: true
      tags: [server_setup]

    - name: Reset connection to apply group membership changes
      meta: reset_connection
      tags: [server_setup]

    # 7. Authenticate to pull the private Docker Hub image
    - name: Pull and prepare the versioned BorrowBox image
      block:
        - name: Log in to Docker Hub
          command:
            argv:
              - docker
              - login
              - --username
              - "{{ dockerhub_username }}"
              - --password-stdin
            stdin: "{{ dockerhub_token }}"
            stdin_add_newline: false
          no_log: true

        - name: Pull the requested BorrowBox image
          command:
            argv:
              - docker
              - pull
              - "{{ image_name }}:{{ image_tag }}"

      always:
        - name: Log out from Docker Hub
          command:
            argv:
              - docker
              - logout
          failed_when: false
          changed_when: false
          no_log: true

    # 8. Create the private Docker network used by Prometheus and Grafana
    - name: Check BorrowBox monitoring network
      command:
        argv:
          - docker
          - network
          - inspect
          - "{{ monitoring_network }}"
      register: monitoring_network_check
      changed_when: false
      failed_when: false

    - name: Create BorrowBox monitoring network if absent
      command:
        argv:
          - docker
          - network
          - create
          - "{{ monitoring_network }}"
      when: monitoring_network_check.rc != 0

    # 9. Replace the running BorrowBox container
    - name: Remove previous BorrowBox container if present
      command:
        argv:
          - docker
          - rm
          - --force
          - borrowbox
      register: previous_container
      failed_when: previous_container.rc not in [0, 1]
      changed_when: previous_container.rc == 0

    - name: Run the versioned BorrowBox container
      command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - borrowbox
          - --publish
          - "80:{{ app_port }}"
          - --restart
          - unless-stopped
          - --network
          - "{{ monitoring_network }}"
          - --env
          - "PORT={{ app_port }}"
          - --env
          - "NODE_ENV={{ node_env }}"
          - --env
          - MONGODB_URI
          - "{{ image_name }}:{{ image_tag }}"
      environment:
        MONGODB_URI: "{{ mongodb_uri }}"
      no_log: true

    # 10. Require the application's database-aware health check to pass
    - name: Verify BorrowBox API health
      uri:
        url: http://localhost/api/health
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 12
      delay: 5

    # 11. Ensure persistent monitoring volumes exist
    - name: Check Prometheus data volume
      command:
        argv:
          - docker
          - volume
          - inspect
          - borrowbox-prometheus-data
      register: prometheus_volume_check
      changed_when: false
      failed_when: false

    - name: Create Prometheus data volume if absent
      command:
        argv:
          - docker
          - volume
          - create
          - borrowbox-prometheus-data
      when: prometheus_volume_check.rc != 0

    - name: Check Grafana data volume
      command:
        argv:
          - docker
          - volume
          - inspect
          - borrowbox-grafana-data
      register: grafana_volume_check
      changed_when: false
      failed_when: false

    - name: Create Grafana data volume if absent
      command:
        argv:
          - docker
          - volume
          - create
          - borrowbox-grafana-data
      when: grafana_volume_check.rc != 0

    # 12. Install monitoring configuration on the EC2 host
    - name: Create monitoring configuration directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: docker
        mode: '0755'
      become: true
      loop:
        - "{{ monitoring_root }}"
        - "{{ monitoring_root }}/grafana/provisioning/datasources"
        - "{{ monitoring_root }}/grafana/provisioning/dashboards"
        - "{{ monitoring_root }}/grafana/dashboards"

    - name: Copy Prometheus scrape configuration
      copy:
        src: "{{ playbook_dir }}/../monitoring/prometheus.yml"
        dest: "{{ monitoring_root }}/prometheus.yml"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Copy Grafana Prometheus datasource configuration
      copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/datasources/prometheus.yml"
        dest: "{{ monitoring_root }}/grafana/provisioning/datasources/prometheus.yml"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Copy Grafana dashboard provisioning configuration
      copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/dashboards/default.yml"
        dest: "{{ monitoring_root }}/grafana/provisioning/dashboards/default.yml"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Copy BorrowBox Grafana dashboard
      copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/dashboards/borrowbox.json"
        dest: "{{ monitoring_root }}/grafana/dashboards/borrowbox.json"
        owner: ubuntu
        group: docker
        mode: '0644'

    # 13. Pull monitoring images before replacing existing monitoring containers
    - name: Pull Prometheus image
      command:
        argv:
          - docker
          - pull
          - "{{ prometheus_image }}"

    - name: Pull Grafana image
      command:
        argv:
          - docker
          - pull
          - "{{ grafana_image }}"

    # 14. Recreate monitoring containers on the internal network
    - name: Remove previous Prometheus container if present
      command:
        argv:
          - docker
          - rm
          - --force
          - prometheus
      register: previous_prometheus
      failed_when: previous_prometheus.rc not in [0, 1]
      changed_when: previous_prometheus.rc == 0

    - name: Run Prometheus without a host port
      command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - prometheus
          - --network
          - "{{ monitoring_network }}"
          - --restart
          - unless-stopped
          - --mount
          - "type=bind,src={{ monitoring_root }}/prometheus.yml,dst=/etc/prometheus/prometheus.yml,readonly"
          - --mount
          - type=volume,src=borrowbox-prometheus-data,dst=/prometheus
          - "{{ prometheus_image }}"
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=3d

    - name: Remove previous Grafana container if present
      command:
        argv:
          - docker
          - rm
          - --force
          - grafana
      register: previous_grafana
      failed_when: previous_grafana.rc not in [0, 1]
      changed_when: previous_grafana.rc == 0

    - name: Run Grafana bound to localhost only
      command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - grafana
          - --network
          - "{{ monitoring_network }}"
          - --restart
          - unless-stopped
          - --publish
          - 127.0.0.1:3000:3000
          - --mount
          - type=volume,src=borrowbox-grafana-data,dst=/var/lib/grafana
          - --mount
          - "type=bind,src={{ monitoring_root }}/grafana/provisioning,dst=/etc/grafana/provisioning,readonly"
          - --mount
          - "type=bind,src={{ monitoring_root }}/grafana/dashboards,dst=/var/lib/grafana/dashboards,readonly"
          - --env
          - GF_AUTH_ANONYMOUS_ENABLED=true
          - --env
          - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
          - "{{ grafana_image }}"
      no_log: true
