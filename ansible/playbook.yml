---
- name: Configure EC2 Instance and Deploy BorrowBox MERN Application
  hosts: webservers
  become: false
  vars_files:
    - vars/secrets.yml

  tasks:
    # 1. Wait for SSH connectivity
    - name: Wait for SSH connectivity
      wait_for_connection:
        delay: 5
        timeout: 300

    # 2. Update apt package metadata
    - name: Update apt package metadata
      apt:
        update_cache: yes
      become: true

    # 3. Install baseline prerequisite packages
    - name: Install required prerequisite packages
      apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present
      become: true

    # 4. Install Docker Engine using official Docker repository
    - name: Create directory for Docker GPG keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Download Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true

    - name: Add Docker official repository to apt sources
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      become: true

    - name: Install Docker Engine and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      become: true

    # 5. Ensure the Docker service is enabled and running
    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes
      become: true

    # 6. Ensure ubuntu user can run Docker without sudo
    - name: Add ubuntu user to the docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      become: true

    - name: Reset connection to apply group membership changes
      meta: reset_connection

    # 7. Clone the BorrowBox repository and prepare directory
    - name: Ensure SSH configuration directory exists on EC2 host
      file:
        path: /home/ubuntu/.ssh
        state: directory
        mode: '0700'

    - name: Fetch GitHub SSH host keys dynamically
      command: ssh-keyscan -t rsa,ed25519 github.com
      register: github_host_keys
      changed_when: false

    - name: Add GitHub host keys to verified known_hosts file
      known_hosts:
        name: github.com
        key: "{{ item }}"
        path: /home/ubuntu/.ssh/known_hosts
      loop: "{{ github_host_keys.stdout_lines }}"

    - name: Ensure deployment directory exists with correct permissions
      file:
        path: /home/ubuntu/borrowbox
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone BorrowBox repository from GitHub (private clone)
      git:
        repo: 'git@github.com:Amy-codes-stuff/borrowbox.git'
        dest: /home/ubuntu/borrowbox
        version: main
        force: yes

    # 8. Create application's .env file from template (loads secrets.yml)
    - name: Generate the application .env file from template
      template:
        src: templates/env.j2
        dest: /home/ubuntu/borrowbox/.env
        mode: '0600'

    # 9. Build BorrowBox Docker image
    - name: Build BorrowBox Docker image
      shell:
        cmd: docker build -t borrowbox:latest .
        chdir: /home/ubuntu/borrowbox

    # 10. Stop and remove previous BorrowBox container if it exists
    - name: Stop existing BorrowBox container if it exists
      shell:
        cmd: docker stop borrowbox
      failed_when: false
      changed_when: false

    - name: Remove existing BorrowBox container if it exists
      shell:
        cmd: docker rm borrowbox
      failed_when: false
      changed_when: false

    # 11. Run the BorrowBox container (Port 80 to 5000, restart unless-stopped)
    - name: Run BorrowBox container
      shell:
        cmd: docker run -d --name borrowbox -p 80:5000 --env-file /home/ubuntu/borrowbox/.env --restart unless-stopped borrowbox:latest

    # 12. Verify the application is responding on port 80 after deployment
    - name: Verify application is responding on port 80
      uri:
        url: http://localhost
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 6
      delay: 10
