---
- name: Configure EC2 Instance and Deploy BorrowBox MERN Application
  hosts: webservers
  become: false
  vars:
    app_port: 5000
    node_env: production

  tasks:
    # 1. Wait for SSH connectivity
    - name: Wait for SSH connectivity
      wait_for_connection:
        delay: 5
        timeout: 300
      tags: [server_setup]

    # 2. Update apt package metadata
    - name: Update apt package metadata
      apt:
        update_cache: yes
      become: true
      tags: [server_setup]

    # 3. Install baseline prerequisite packages
    - name: Install required prerequisite packages
      apt:
        name:
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present
      become: true
      tags: [server_setup]

    # 4. Install Docker Engine using official Docker repository
    - name: Create directory for Docker GPG keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true
      tags: [server_setup]

    - name: Download Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true
      tags: [server_setup]

    - name: Add Docker official repository to apt sources
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      become: true
      tags: [server_setup]

    - name: Install Docker Engine and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      become: true
      tags: [server_setup]

    # 5. Ensure the Docker service is enabled and running
    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes
      become: true
      tags: [server_setup]

    # 6. Ensure ubuntu user can run Docker without sudo
    - name: Add ubuntu user to the docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      become: true
      tags: [server_setup]

    - name: Reset connection to apply group membership changes
      meta: reset_connection
      tags: [server_setup]

    # 7. Authenticate to pull the private Docker Hub image
    - name: Pull and prepare the versioned BorrowBox image
      block:
        - name: Log in to Docker Hub
          command:
            argv:
              - docker
              - login
              - --username
              - "{{ dockerhub_username }}"
              - --password-stdin
            stdin: "{{ dockerhub_token }}"
            stdin_add_newline: false
          no_log: true

        - name: Pull the requested BorrowBox image
          command:
            argv:
              - docker
              - pull
              - "{{ image_name }}:{{ image_tag }}"

      always:
        - name: Log out from Docker Hub
          command:
            argv:
              - docker
              - logout
          failed_when: false
          changed_when: false
          no_log: true

    # 8. Replace the running BorrowBox container
    - name: Remove previous BorrowBox container if present
      command:
        argv:
          - docker
          - rm
          - --force
          - borrowbox
      register: previous_container
      failed_when: previous_container.rc not in [0, 1]
      changed_when: previous_container.rc == 0

    - name: Run the versioned BorrowBox container
      command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - borrowbox
          - --publish
          - "80:{{ app_port }}"
          - --restart
          - unless-stopped
          - --env
          - "PORT={{ app_port }}"
          - --env
          - "NODE_ENV={{ node_env }}"
          - --env
          - MONGODB_URI
          - "{{ image_name }}:{{ image_tag }}"
      environment:
        MONGODB_URI: "{{ mongodb_uri }}"
      no_log: true

    # 9. Require the application's database-aware health check to pass
    - name: Verify BorrowBox API health
      uri:
        url: http://localhost/api/health
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 12
      delay: 5
